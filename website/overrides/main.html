{% extends "base.html" %}
{% block extrahead %}
  {{ super() }}
  <meta property="og:title" content="{{ page.title | e }} · {{ config.site_name | e }}">
  <meta property="og:description" content="{{ config.site_description | e }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.canonical_url | e }}">
  <meta property="og:image" content="{{ config.site_url }}assets/social.png">
  <meta name="twitter:card" content="summary">
{% endblock %}
